{% extends "base.html" %}{% block contenido %}
<h1>Nuevo usuario</h1>
<form class="card" method="post">{{ m.csrf() }}
<label>Nombre</label><input name="nombre" value="{{ reg.get('nombre','') }}" required>
<label>Usuario o correo (único)</label><input name="login" value="{{ reg.get('login','') }}" autocomplete="off" required>
<label>Contraseña (mínimo 8 caracteres)</label><input name="password" type="password" autocomplete="new-password" required>
<label>Rol</label><select name="rol">{% for r in roles %}<option {{ 'selected' if reg.get('rol')==r }}>{{ r }}</option>{% endfor %}</select>
<label>Puesto</label><select name="puesto_id" required><option value="">Seleccione…</option>{% for p in puestos %}<option value="{{ p.id }}" {{ 'selected' if reg.get('puesto_id')==p.id|string }}>{{ p.ruta }} / {{ p.codigo }} · {{ p.nombre }}</option>{% endfor %}</select>
<p><button type="submit">Guardar</button> <a class="btn sec" href="{{ url_for('usuarios.lista') }}">Cancelar</a></p></form>{% endblock %}
