{% extends "base.html" %}{% block contenido %}
<div class="card login"><h1>Iniciar sesión</h1>
<form method="post" action="{{ url_for('auth.login') }}">
<input type="hidden" name="siguiente" value="{{ siguiente }}">
<label for="login">Usuario o correo</label><input id="login" name="login" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<p><button type="submit">Entrar</button></p></form></div>{% endblock %}
